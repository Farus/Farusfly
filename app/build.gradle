plugins { id 'com.android.application' }
android {
    namespace 'cl.farus.farusfly'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.farus.farusfly'
        minSdk 26
        multiDexEnabled true
        targetSdk 35
        manifestPlaceholders = [DJI_APP_KEY: (project.findProperty('DJI_APP_KEY') ?: 'REPLACE_WITH_DJI_APP_KEY')]
        versionCode 15
        versionName '0.8.7'
    }
    // Match the native packaging used by DJI's Android SDK 4.18 sample.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                '**/libdjivideo.so',
                '**/libSDKRelativeJNI.so',
                '**/libFlyForbid.so',
                '**/libduml_vision_bokeh.so',
                '**/libyuv2.so',
                '**/libGroudStation.so',
                '**/libFRCorkscrew.so',
                '**/libUpgradeVerify.so',
                '**/libFR.so',
                '**/libDJIFlySafeCore.so',
                '**/libdjifs_jni.so',
                '**/libsfjni.so',
                '**/libDJICommonJNI.so',
                '**/libDJICSDKCommon.so',
                '**/libDJIUpgradeCore.so',
                '**/libDJIUpgradeJNI.so',
                '**/libDJIWaypointV2Core.so',
                '**/libAMapSDK_MAP_v6_9_2.so',
                '**/libDJIMOP.so',
                '**/libDJISDKLOGJNI.so'
            ]
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.22'
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.mlkit:object-detection:17.0.2'
    implementation('com.dji:dji-sdk:4.18') {
        exclude module: 'fly-safe-database'
    }
    compileOnly 'com.dji:dji-sdk-provided:4.18'
    implementation 'androidx.multidex:multidex:2.0.1'
}
